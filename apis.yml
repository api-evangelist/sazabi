aid: sazabi
name: Sazabi
description: >-
  Sazabi is an AI-native observability platform that helps engineering teams find
  and fix production issues faster. Autonomous agents watch application logs
  (stdout/stderr) to detect anomalies, unfamiliar errors, traffic spikes, and
  failed deployments without traditional dashboards, then deliver contextual,
  root-cause alerts into Slack and Microsoft Teams. Engineers investigate in
  natural language by mentioning the Sazabi agent, and the platform can hand off
  context to coding agents such as Claude, Cursor, and Codex or open pull requests
  to remediate. Sazabi instruments 35+ hosting providers with no code changes and
  exposes a hosted Sazabi MCP server so agents can query logs, inspect issues and
  projects, and discover Sazabi tools. Founded by Sherwood Callaway; part of the
  Y Combinator P26 (Spring 2026) batch; backed by an $8M seed round led by
  J2 Ventures, Village Global, and Y Combinator, with an open beta.
